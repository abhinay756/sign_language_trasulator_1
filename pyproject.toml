[project]
name = "handsign"
version = "0.1.0"
description = "Fresh real-time hand sign recognition for alphabet and common gestures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10.14,<0.10.22",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scikit-learn>=1.3",
    "torch>=2.1",
]

[project.scripts]
collect-signs = "sign_language.collect:main"
train-signs = "sign_language.train:main"
realtime-signs = "sign_language.realtime:main"
evaluate-signs = "sign_language.evaluate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
